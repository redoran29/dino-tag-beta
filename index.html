		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #213324;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* No page scroll, pull-to-refresh, text selection or long-tap callout (req. 1.6.1.8, 1.10.2). */
html, body {
	overscroll-behavior: none;
}

body {
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	user-select: none;
}

/* At fractional device pixel ratios the browser resamples the canvas: keep the pixels sharp. */
#canvas {
	image-rendering: pixelated;
}

/* The loading bar in the colors of the game's panels. */
#status-progress {
	appearance: none;
	height: 10px;
	border: 2px solid #ede6cc;
	background: transparent;
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	background: #ede6cc;
}

#status-progress::-moz-progress-bar {
	background: #ede6cc;
}

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--false" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
// The loading screen covers the canvas, whose own handler doesn't reach it.
document.addEventListener('contextmenu', (event) => event.preventDefault());

// Yandex Games, when the game runs there: the platform's side of autoload/platform.gd, which
// reaches it through JavaScriptBridge (D11). Elsewhere (the beta, local checks) `available` stays
// false and the game keeps its local backend.
const yandexGames = {
	available: false,
	// The Yandex Games interface language, ISO 639-1.
	lang: '',
	// The player's saved data as JSON, or null if it couldn't be loaded.
	data: null,
	// Whether the platform has paused the game: an ad, a hidden tab. Platform sets onPauseChanged.
	paused: false,
	onPauseChanged: null,
};
window.yandexGames = yandexGames;

const yandexReady = (function () {
	const TIMEOUT_MS = 10000;
	// The platform allows 100 writes per 5 minutes.
	const SAVE_INTERVAL_MS = 3000;
	const AD_OPEN_TIMEOUT_MS = 5000;
	let sdk = null;
	let player = null;
	let pendingSave = null;
	let saving = false;
	let lastSaveAt = -Infinity;
	let saveTimer = 0;

	function loadScript(src) {
		return new Promise((resolve, reject) => {
			const script = document.createElement('script');
			script.src = src;
			script.onload = resolve;
			script.onerror = () => reject(new Error(`${src} didn't load`));
			document.head.append(script);
		});
	}

	// Outside Yandex the SDK may never answer.
	function inTime(promise) {
		return Promise.race([promise, new Promise((resolve, reject) => {
			setTimeout(() => reject(new Error('no answer in time')), TIMEOUT_MS);
		})]);
	}

	function setPaused(paused) {
		yandexGames.paused = paused;
		if (yandexGames.onPauseChanged) {
			yandexGames.onPauseChanged(paused);
		}
	}

	// One write at a time, and none sooner than SAVE_INTERVAL_MS after the last: a newer save
	// replaces one still waiting. A hidden page writes at once, as it may never come back.
	function writeSave(now) {
		if (!pendingSave || saving) {
			return;
		}
		const wait = lastSaveAt + SAVE_INTERVAL_MS - Date.now();
		if (wait > 0 && !now) {
			saveTimer = saveTimer || setTimeout(() => {
				saveTimer = 0;
				writeSave(false);
			}, wait);
			return;
		}
		const data = pendingSave;
		pendingSave = null;
		saving = true;
		lastSaveAt = Date.now();
		player.setData(data, true).catch((error) => {
			console.warn('Yandex Games: saving failed, will retry.', error);
			pendingSave = pendingSave || data;
		}).finally(() => {
			saving = false;
			writeSave(false);
		});
	}

	yandexGames.ready = () => sdk.features.LoadingAPI?.ready();
	yandexGames.gameplay = (on) => (on ? sdk.features.GameplayAPI?.start() : sdk.features.GameplayAPI?.stop());
	yandexGames.save = (json) => {
		if (player) {
			pendingSave = JSON.parse(json);
			writeSave(false);
		}
	};
	// Calls done once the ad is over, or if none showed. Offline the SDK calls nothing back, and
	// an ad that hasn't opened in AD_OPEN_TIMEOUT_MS won't hold the game up either.
	yandexGames.showAd = (done) => {
		let opened = false;
		let finished = false;
		const finish = () => {
			if (!finished) {
				finished = true;
				done();
			}
		};
		if (!navigator.onLine) {
			finish();
			return;
		}
		setTimeout(() => {
			if (!opened) {
				finish();
			}
		}, AD_OPEN_TIMEOUT_MS);
		try {
			sdk.adv.showFullscreenAdv({
				callbacks: {
					onOpen: () => {
						opened = true;
					},
					onClose: finish,
					onError: finish,
				},
			});
		} catch (error) {
			console.warn('Yandex Games: no ad.', error);
			finish();
		}
	};
	document.addEventListener('visibilitychange', () => {
		if (document.hidden) {
			writeSave(true);
		}
	});

	// Yandex always frames the game, and its SDK loader refuses to start outside a frame.
	// `?yandex` opens the SDK's dev adapter at the top level (sdk-dev-proxy --dev-mode).
	if (window === window.top && !new URLSearchParams(window.location.search).has('yandex')) {
		return Promise.resolve();
	}
	return inTime(loadScript('/sdk.js')).then(() => inTime(YaGames.init())).then((ysdk) => {
		sdk = ysdk;
		yandexGames.available = true;
		yandexGames.lang = sdk.environment.i18n.lang;
		// Subscribed before the game starts: the platform's opening ad pauses it with no callback
		// of its own, and a subscriber is told at once if the game is paused already.
		sdk.on('game_api_pause', () => setPaused(true));
		sdk.on('game_api_resume', () => setPaused(false));
		return inTime(sdk.getPlayer()).then((found) => inTime(found.getData()).then((data) => {
			yandexGames.data = JSON.stringify(data);
			player = found;
		})).catch((error) => console.warn('Yandex Games: no saved data this time.', error));
	}).catch((error) => console.warn('Yandex Games SDK unavailable, playing locally.', error));
}());

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8716692,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const loadingProgress = document.getElementById('status-progress');
const engine = new Engine({
	...GODOT_CONFIG,
	// The engine's preloader may report once more after the loading screen is gone.
	'onProgress': function (current, total) {
		const statusProgress = loadingProgress;
		if (current > 0 && total > 0) {
			statusProgress.value = current;
			statusProgress.max = total;
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
		}
	},
});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// The engine downloads while the SDK starts and the saved data comes; Platform reads that
		// data as the game starts.
		const pack = `${GODOT_CONFIG['executable']}.pck`;
		Promise.all([
			engine.init(GODOT_CONFIG['executable']),
			engine.preloadFile(pack, pack),
			yandexReady,
		]).then(() => engine.start({ 'args': ['--main-pack', pack] })).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
